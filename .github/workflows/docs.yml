name: Docs (Schematic)

# `sch check` over the docs corpus. Errors fail the PR; propagation warnings
# (docs that may need updating because something they reference changed) are
# reported in the job summary and a sticky PR comment but never fail it.
# Fork PRs get no secrets: they run the deterministic rules only and the report
# says so.

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "schematic.yaml"
      - "scripts/ci/sch-check.sh"
      - "scripts/ci/install-sch.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sch-check:
    name: sch check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # Empty on fork PRs and when the secret is not configured: sch-check.sh
      # then degrades to the deterministic rules.
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sch compares main..HEAD

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"   # Schematic requires Bun >= 1.4

      - name: Cache sch binary
        id: sch-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/sch
          key: sch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/install-sch.sh') }}

      - name: Install sch (pinned commit, built from source)
        if: steps.sch-cache.outputs.cache-hit != 'true'
        env:
          # Only needed while the schematic repo is private.
          SCH_REPO_TOKEN: ${{ secrets.SCHEMATIC_REPO_TOKEN }}
        run: scripts/ci/install-sch.sh

      - name: Add sch to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: sch check
        id: check
        env:
          SCH_BASE: origin/${{ github.base_ref || 'main' }}
        run: scripts/ci/sch-check.sh

      - name: Sticky PR comment (same-repo PRs only)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          REPORT: ${{ runner.temp }}/sch/report.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- sch-check-report -->';
            if (!fs.existsSync(process.env.REPORT)) return;
            const body = `${marker}\n${fs.readFileSync(process.env.REPORT, 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const existing = (await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number }))
              .find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sch-report
          path: ${{ runner.temp }}/sch
          if-no-files-found: ignore
