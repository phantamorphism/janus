[package]
name = "janus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords = ["proxy", "credentials", "cli", "ai-agents", "security"]
categories = ["command-line-utilities", "network-programming"]
# Not published to crates.io yet; see docs/development.md.
publish = false
description = "Admin CLI for janus-daemon: manage credentials and opaque identities, inspect pool and plugin health, query and tail the request log."

[[bin]]
name = "janus"
path = "src/main.rs"

[dependencies]
janus-core.workspace = true
# The daemon library supplies what the CLI must not reimplement: the
# `plugin tls init` generator, `check-config`'s full startup validation,
# the config loader (for `data_dir`) and the request-log outcome names.
janus-daemon.workspace = true
tokio.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
bytes.workspace = true
reqwest.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
humantime.workspace = true
chrono.workspace = true
clap.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
