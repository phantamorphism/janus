<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Janus listeners: data plane TCP, admin unix socket, optional admin TCP, optional UI listener, and the plugin channel">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7b8798" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2fb8a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#e8a33d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="520" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<g font-family="'Inter','Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" fill="#1f2937">
<text x="600" y="38" font-size="20" text-anchor="middle" fill="#1f2937" font-weight="700">Four ways in, one way out to a plugin</text>
<rect x="440" y="70" width="320" height="400" rx="14" fill="#ffffff" stroke="#7b8798" stroke-width="2.5"/>
<text x="600" y="100" font-size="19" text-anchor="middle" fill="#1f2937" font-weight="700">janus-daemon</text>
<rect x="460" y="124" width="280" height="52" rx="8" fill="#f6f8fa" stroke="#2fb8a8" stroke-width="2"/>
<text x="600" y="146" font-size="15" font-weight="700" text-anchor="middle">Data plane</text><text x="600" y="164" font-size="12.5" fill="#57606a" text-anchor="middle">[data_plane].bind  TCP</text>
<rect x="460" y="188" width="280" height="52" rx="8" fill="#f6f8fa" stroke="#7b8798" stroke-width="2"/>
<text x="600" y="210" font-size="15" font-weight="700" text-anchor="middle">Admin socket</text><text x="600" y="228" font-size="12.5" fill="#57606a" text-anchor="middle">admin.sock, mode 0600</text>
<rect x="460" y="252" width="280" height="52" rx="8" fill="#f6f8fa" stroke="#7b8798" stroke-width="2"/>
<text x="600" y="274" font-size="15" font-weight="700" text-anchor="middle">Admin TCP</text><text x="600" y="292" font-size="12.5" fill="#57606a" text-anchor="middle">[admin].bind, optional</text>
<rect x="460" y="316" width="280" height="52" rx="8" fill="#f6f8fa" stroke="#7b8798" stroke-width="2"/>
<text x="600" y="338" font-size="15" font-weight="700" text-anchor="middle">UI listener</text><text x="600" y="356" font-size="12.5" fill="#57606a" text-anchor="middle">[ui].bind, optional</text>
<rect x="460" y="392" width="280" height="62" rx="8" fill="#fdf3e0" stroke="#e8a33d" stroke-width="2"/><text x="600" y="416" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="700">Credential pool + request log</text>
<text x="600" y="438" font-size="12.5" text-anchor="middle" fill="#57606a" font-weight="400">data_dir/credentials, data_dir/janus.db</text>
<rect x="40" y="110" width="260" height="80" rx="10" fill="#ffffff" stroke="#2fb8a8" stroke-width="2"/>
<text x="170.0" y="136" font-size="17" font-weight="700" text-anchor="middle">Sandboxed callers</text>
<text x="170.0" y="160" font-size="14" fill="#57606a" text-anchor="middle">present an identity</text>
<path d="M300 150 H458" fill="none" stroke="#2fb8a8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#at)"/>
<text x="380" y="140" font-size="12" text-anchor="middle" fill="#2fb8a8" font-weight="700">proxy traffic only</text>
<rect x="40" y="200" width="260" height="108" rx="10" fill="#ffffff" stroke="#7b8798" stroke-width="2"/>
<text x="170.0" y="226" font-size="17" font-weight="700" text-anchor="middle">janus CLI</text>
<text x="170.0" y="250" font-size="14" fill="#57606a" text-anchor="middle">same host, same user</text>
<text x="170.0" y="270" font-size="14" fill="#57606a" text-anchor="middle">no token: the socket's</text>
<text x="170.0" y="290" font-size="14" fill="#57606a" text-anchor="middle">permissions are the auth</text>
<path d="M300 254 H380 V214 H458" fill="none" stroke="#7b8798" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="40" y="334" width="260" height="90" rx="10" fill="#ffffff" stroke="#7b8798" stroke-width="2"/>
<text x="170.0" y="360" font-size="17" font-weight="700" text-anchor="middle">CLI / tools on another host</text>
<text x="170.0" y="384" font-size="14" fill="#57606a" text-anchor="middle">admin token on every call</text>
<text x="170.0" y="404" font-size="14" fill="#57606a" text-anchor="middle">TLS off loopback</text>
<path d="M300 380 H360 V278 H458" fill="none" stroke="#7b8798" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="900" y="110" width="260" height="92" rx="10" fill="#ffffff" stroke="#7b8798" stroke-width="2"/>
<text x="1030.0" y="136" font-size="17" font-weight="700" text-anchor="middle">Operator browser</text>
<text x="1030.0" y="160" font-size="14" fill="#57606a" text-anchor="middle">admin token in the page</text>
<text x="1030.0" y="180" font-size="14" fill="#57606a" text-anchor="middle">asks once at login</text>
<path d="M900 156 H820 V342 H742" fill="none" stroke="#7b8798" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="900" y="300" width="260" height="150" rx="10" fill="#ffffff" stroke="#7b8798" stroke-width="2" stroke-dasharray="6 5"/>
<text x="1030.0" y="326" font-size="17" font-weight="700" text-anchor="middle">Policy plugin</text>
<text x="1030.0" y="350" font-size="14" fill="#57606a" text-anchor="middle">gRPC, daemon is the client</text>
<text x="1030.0" y="370" font-size="14" fill="#57606a" text-anchor="middle">unix socket (path perms)</text>
<text x="1030.0" y="390" font-size="14" fill="#57606a" text-anchor="middle">mutual TLS over the network</text>
<text x="1030.0" y="410" font-size="14" fill="#57606a" text-anchor="middle">or linked into a custom build</text>
<path d="M762 380 H898" fill="none" stroke="#7b8798" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="830" y="370" font-size="12" text-anchor="middle" fill="#57606a" font-weight="400">ResolveRoute, Notify</text>
<text x="600" y="500" font-size="13" text-anchor="middle" fill="#57606a" font-weight="400">Admin routes are never mounted on the data plane: an admin path there is a 404.</text>
</g>
</svg>
